name: Archive repository statistics

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-statistics
  cancel-in-progress: false

jobs:
  collect:
    name: Collect GitHub statistics
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect repository statistics
        env:
          GH_TOKEN: ${{ github.token }}
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python tools/archive_repository_stats.py

      - name: Commit updated statistics
        shell: bash
        run: |
          git add stats/repository-stats.json

          if git diff --cached --quiet; then
            echo "No statistics changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(stats): archive repository metrics"
          git push
